# Lean 4 package for Reservoir (https://reservoir.lean-lang.org), gathering the runtimes in
# `serde-generate/runtime/lean`. Code generated by `serde-generate` uses copies of these
# runtimes instead (see `serde_generate::lean4::Installer`).
name = "serde-lean"
version = "0.1.0"
description = "BCS and Bincode serialization for Lean 4, with machine-checked proofs of correctness"
keywords = ["serialization", "bcs", "bincode", "software-verification"]
homepage = "https://github.com/zefchain/serde-reflection"
license = "MIT OR Apache-2.0"
licenseFiles = ["LICENSE-MIT", "LICENSE-APACHE"]
readmeFile = "serde-generate/runtime/lean/README.md"
defaultTargets = ["Serde", "Bcs", "Bincode"]

[[lean_lib]]
name = "Serde"
srcDir = "serde-generate/runtime/lean/serde"
roots = ["Serde", "Serde.Lawful"]

[[lean_lib]]
name = "Bcs"
srcDir = "serde-generate/runtime/lean/bcs"
roots = ["Bcs", "Bcs.Lawful"]

[[lean_lib]]
name = "Bincode"
srcDir = "serde-generate/runtime/lean/bincode"
roots = ["Bincode", "Bincode.Lawful"]
